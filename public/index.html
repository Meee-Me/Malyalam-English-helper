<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>മലയാളം AI സഹായി</title>
  <meta name="theme-color" content="#212121" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar: new chat + list of past chats -->
    <aside id="sidebar" class="sidebar" aria-label="സംഭാഷണങ്ങൾ">
      <div class="side-top">
        <button id="closeSidebar" class="icon-btn only-mobile" aria-label="Close menu">✕</button>
        <button id="newChat" class="side-new">
          <span class="side-new-icon">✎</span>
          <span>പുതിയ സംഭാഷണം</span>
        </button>
      </div>
      <p class="side-heading">പഴയ സംഭാഷണങ്ങൾ</p>
      <nav id="chatList" class="chat-list"></nav>
      <div class="side-bottom">
        <span>അക്ഷര വലുപ്പം</span>
        <div class="size-btns">
          <button id="smaller" class="icon-btn" aria-label="Smaller text">A−</button>
          <button id="bigger" class="icon-btn" aria-label="Bigger text">A+</button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <!-- Main chat area -->
    <div class="main">
      <header class="topbar">
        <button id="openSidebar" class="icon-btn only-mobile" aria-label="Menu">☰</button>
        <h1 class="title">മലയാളം AI സഹായി</h1>
        <button id="newChatTop" class="icon-btn only-mobile" aria-label="New chat">✎</button>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <div id="thread" class="thread"></div>

        <section id="welcome" class="welcome">
          <img src="icon.svg" alt="" width="56" height="56" />
          <h2>ഇന്ന് ഞാൻ എങ്ങനെ സഹായിക്കണം?</h2>
          <p class="voice-only">🎤 അമർത്തി ചോദ്യം പറയൂ. പറഞ്ഞു കഴിഞ്ഞാൽ വീണ്ടും അമർത്തൂ.</p>
          <div class="chips">
            <button class="chip">ഇന്നത്തെ ആരോഗ്യകരമായ ഭക്ഷണം എന്ത് കഴിക്കാം?</button>
            <button class="chip">ഷുഗർ നിയന്ത്രിക്കാൻ എന്തൊക്കെ ശ്രദ്ധിക്കണം?</button>
            <button class="chip">വാട്ട്സ്ആപ്പിൽ ഫോട്ടോ എങ്ങനെ അയയ്ക്കാം?</button>
            <button class="chip">ഒരു ചെറിയ തമാശ പറയൂ</button>
          </div>
        </section>
      </main>

      <footer class="composer">
        <div id="setupNote" class="setup-note" hidden></div>
        <div id="recStatus" class="rec-status" hidden></div>
        <form id="form" class="composer-box" autocomplete="off">
          <button type="button" id="mic" class="mic" title="അമർത്തി സംസാരിക്കുക" aria-label="Record voice" hidden>🎤</button>
          <textarea id="input" rows="1" placeholder="ചോദിക്കൂ…" aria-label="Message"></textarea>
          <button type="submit" id="send" class="send" title="അയയ്ക്കുക" aria-label="Send">↑</button>
        </form>
        <p class="hint">AI ചിലപ്പോൾ തെറ്റുകൾ വരുത്താം. പ്രധാന കാര്യങ്ങൾ ഉറപ്പാക്കുക.</p>
      </footer>
    </div>
  </div>

  <dialog id="pwDialog">
    <form method="dialog">
      <h3>പാസ്‌വേഡ്</h3>
      <p>ഈ സൈറ്റ് ഉപയോഗിക്കാൻ പാസ്‌വേഡ് നൽകുക.</p>
      <input id="pwInput" type="password" required />
      <button class="primary-btn" type="submit">ശരി</button>
    </form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
